name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --console=plain

      - name: unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: test report
        if: always()
        uses: mikepenx/action-junit-report@v4
        with:
          report_paths: app/build/test-results/testDebugUnitTest/TEST-*.xml

      - name: roborazzi verify (screenshots must still match)
        run: ./gradlew :app:verifyRoborazziDebug --console=plain

      - name: upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
<html>

<style>
  :root { color-scheme: light dark; }
  html, body {
    margin: 0; padding: 8px;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    background: #FAF9F5; color: #3D3929;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #30302E; color: #F5F4EE; }
  }
  pre.mermaid, .beacon-mermaid { background: transparent; }
</style>
</head>
<body>
<div id="beacon-root">__BEACON_CARD_HTML__</div>
<script>
(function () {
  function report() {
    var h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    if (window.Beacon && Beacon.height) Beacon.height(h);
  }

  function renderVendors() {
    try {
      if (window.mermaid) {
        mermaid.initialize({ startOnLoad: false, theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
        mermaid.run({ querySelector: 'pre.mermaid, .beacon-mermaid, pre code.language-mermaid, div.beacon-mermaid' }).catch(function () {});
      }
    } catch (e) {}
    try {
      document.querySelectorAll('code.language-mermaid, .beacon-mermaid').forEach(function (el) {});
      if (window.Chart) {
        document.querySelectorAll('.beacon-chart canvas, canvas.beacon-chart').forEach(function (canvas) { report(); });
      }
    } catch (e) {}
    try {
      if (window.katex) {
        document.querySelectorAll('[data-katex], .beacon-katex').forEach(function (el) {
          var src = el.dataset.tex || el.textContent || '';
          el.innerHTML = '';
          katex.render(src, el, { displayMode: el.dataset.block !== 'inline', throwOnError: false });
        });
      }
    } catch (e) {}
    report();
  }

  window.addEventListener('load', renderVendors);
  new MutationObserver(report).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('resize', report);
  renderVendors();
})();
</script>
</body>
</html>
